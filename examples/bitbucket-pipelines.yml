image: node:18

pipelines:
  default:
    - step:
        name: ObserveOne Tests
        script:
          - npm install -g @observeone/cli
          - obs login --api-key $OBS1_API_KEY
          - obs ai-check "Critical Tests" --reporter junit --output test-results.xml --wait
        artifacts:
          - test-results.xml
        after-script:
          - obs status $OBS1_EXECUTION_ID --results



