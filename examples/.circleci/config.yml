version: 2.1

jobs:
  obs-tests:
    docker:
      - image: cimg/node:18.0
    steps:
      - checkout
      - run:
          name: Install OBS1 CLI
          command: npm install -g obs-cli
      - run:
          name: Authenticate with OBS1
          command: obs login --api-key $OBS_API_KEY
      - run:
          name: Run OBS1 Tests
          command: |
            obs ai-check "Critical Tests" \
              --reporter junit \
              --output test-results.xml \
              --wait
      - store_test_results:
          path: test-results.xml
      - store_artifacts:
          path: test-results.xml

workflows:
  version: 2
  test:
    jobs:
      - obs-tests
